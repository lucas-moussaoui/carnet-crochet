<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16121C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crochet">
<title>Carnet de crochet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout : appli plein écran — barre du haut, vue qui défile, barre d'onglets en bas (à portée de pouce) */
  --bg:#F5F2F7;
  --surface:#FFFFFF;
  --surface-2:#ECE6F1;
  --ink:#2A2238;
  --muted:#675F7B;
  --line:#DAD2E2;
  --accent:#C93A64;
  --accent-soft:#F9E1E8;
  --sage:#2A7A68;
  --on-color:#FFFFFF;
  --danger:#B3261E;
  --shadow:0 1px 2px rgba(42,34,56,.06),0 4px 14px rgba(42,34,56,.08);
  --grid-empty:#F7F4FA;
  --grid-line:#D3CADD;
  --grid-line-strong:#8F849F;
  --row-hl:rgba(201,58,100,.14);
  --font-display:"Bricolage Grotesque",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121C; --surface:#221C2B; --surface-2:#2D2638; --ink:#F1ECF7; --muted:#ABA1BA; --line:#3B3349;
    --accent:#F0739A; --accent-soft:#3D2131; --sage:#5BBFA7; --on-color:#1A1420; --danger:#FF8A80;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
    --grid-empty:#2A2334; --grid-line:#41384F; --grid-line-strong:#7B6F8E; --row-hl:rgba(240,115,154,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16121C; --surface:#221C2B; --surface-2:#2D2638; --ink:#F1ECF7; --muted:#ABA1BA; --line:#3B3349;
  --accent:#F0739A; --accent-soft:#3D2131; --sage:#5BBFA7; --on-color:#1A1420; --danger:#FF8A80;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
  --grid-empty:#2A2334; --grid-line:#41384F; --grid-line-strong:#7B6F8E; --row-hl:rgba(240,115,154,.2);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:14px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

#app{height:100%;display:flex;flex-direction:column;padding-top:var(--safe-top)}
#topbar{display:flex;align-items:center;gap:4px;padding:8px 8px 6px 12px;min-height:58px}
#topbar .title{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:0 4px}
#topbar h1{font-family:var(--font-display);font-weight:750;font-size:23px;line-height:1.15;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title-btn{background:none;border:0;padding:4px;text-align:left;min-width:0;border-radius:10px}
.title-btn h1{font-size:20px!important}
.chainette{height:9px;width:150px;background:radial-gradient(closest-side,transparent 52%,var(--accent) 58% 86%,transparent 92%) 0 0/13px 9px repeat-x;opacity:.85}
#view{flex:1;min-height:0;overflow:auto;position:relative}
#tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:var(--safe-bottom)}
#tabbar[hidden]{display:none}
#tabbar button{background:none;border:0;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:800;color:var(--muted)}
#tabbar button[aria-current="page"]{color:var(--accent)}
#tabbar svg{width:25px;height:25px}

.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:24px;height:24px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-height:44px}
.btn svg{width:20px;height:20px}
.btn.sm{padding:7px 11px;min-height:38px;font-size:14px}
.btn.sm svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--on-color)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn:active{filter:brightness(.95)}
.spacer{flex:1}

/* Accueil */
.home{padding:6px 16px 28px;display:flex;flex-direction:column;gap:12px;max-width:720px;margin:0 auto}
.new-project{border:2px dashed var(--line);background:transparent;border-radius:var(--r);padding:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;color:var(--accent);font-size:17px}
.new-project svg{width:22px;height:22px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.project-card{display:grid;grid-template-columns:68px 1fr auto;gap:12px;align-items:center;padding:10px 6px 10px 10px}
.project-open{display:contents;cursor:pointer}
.project-open:focus-visible .thumb{outline:3px solid var(--accent)}
.thumb{width:68px;height:68px;border-radius:12px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--accent)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb canvas{max-width:100%;max-height:100%;image-rendering:pixelated}
.project-card h3{margin:0;font-family:var(--font-display);font-size:18px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.project-card .meta{font-size:14px;color:var(--muted);margin-top:3px}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12.5px;padding:1px 8px;border-radius:99px;margin-right:4px}
.footnote{margin-top:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.footnote p{margin:0;font-size:14px;color:var(--muted)}
.footnote .row{display:flex;gap:8px;flex-wrap:wrap}
.warn{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:24px 12px}

/* Compteurs */
.counters{height:100%;display:flex;flex-direction:column;gap:12px;padding:10px 16px 14px;max-width:720px;margin:0 auto}
.counter{flex:1;min-height:150px;display:grid;grid-template-columns:1fr 68px;gap:10px}
.tap{border:0;border-radius:24px;background:var(--accent);color:var(--on-color);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;position:relative;overflow:hidden;transition:transform .08s ease-out;padding:10px}
.tap:active{transform:scale(.985)}
.tap.rows{background:var(--sage)}
.tap .label{font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase;opacity:.92}
.tap .num{font-family:var(--font-display);font-weight:800;font-size:clamp(56px,min(24vw,15vh),132px);line-height:1;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.tap .hint{font-size:14px;font-weight:700;opacity:.9;text-align:center}
.tap .progress{position:absolute;left:0;bottom:0;height:9px;width:0;background:currentColor;opacity:.45;transition:width .15s}
.tap.done{box-shadow:inset 0 0 0 4px currentColor,var(--shadow)}
.side{display:flex;flex-direction:column;gap:10px}
.side button{flex:1;border:0;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-size:19px;display:grid;place-items:center;color:var(--ink)}
.side svg{width:24px;height:24px}
.opts{padding:4px 14px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:48px}
.opt + .opt{border-top:1px solid var(--line)}
.opt label{flex:1;font-weight:700;font-size:15px}
.opt input[type=number]{width:84px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font-size:16px;text-align:center}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(20px)}

/* Barres d'outils */
.fullview{height:100%;display:flex;flex-direction:column}
.toolrow{display:flex;gap:6px;padding:8px 12px;align-items:center;overflow-x:auto;scrollbar-width:none;flex:none}
.toolrow::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 9px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:4px;color:var(--muted);min-height:36px}
.seg button svg{width:19px;height:19px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.palette{display:flex;gap:9px;padding:4px 12px 10px;overflow-x:auto;align-items:center;flex:none;scrollbar-width:none}
.palette::-webkit-scrollbar{display:none}
.chip{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0}
.chip[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.chip.tool{background:var(--surface-2);display:grid;place-items:center;border-style:dashed;color:var(--muted)}
.chip.tool svg{width:18px;height:18px}
.canvas-wrap{flex:1;min-height:0;overflow:auto;background:var(--surface-2);padding:12px;display:flex}
.canvas-wrap canvas{display:block;margin:auto;touch-action:none;border-radius:6px;box-shadow:var(--shadow)}
.canvas-wrap.pan canvas{touch-action:pan-x pan-y;cursor:grab}
.footrow{display:flex;gap:6px;align-items:center;padding:7px 12px;border-top:1px solid var(--line);background:var(--bg);overflow-x:auto;flex:none;scrollbar-width:none}
.footrow::-webkit-scrollbar{display:none}
.footrow .lbl{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.hl-toggle{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13px;font-weight:800}
.hl-toggle .switch{width:42px;height:26px}
.hl-toggle .switch::after{width:20px;height:20px}
.hl-toggle .switch:checked::after{transform:translateX(16px)}
.tip{font-size:13px;color:var(--muted);padding:0 12px 6px;flex:none}

/* Patron */
.board-wrap{flex:1;min-height:0;overflow:auto;background:var(--surface-2);padding:16px}
.board{position:relative;background-color:var(--grid-empty);
  background-image:
    linear-gradient(var(--grid-line-strong) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line-strong) 1px,transparent 1px),
    linear-gradient(var(--grid-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:calc(var(--u) * 10) calc(var(--u) * 10),calc(var(--u) * 10) calc(var(--u) * 10),var(--u) var(--u),var(--u) var(--u);
  border-radius:6px;box-shadow:var(--shadow)}
.piece{position:absolute;border-radius:3px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:12px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;padding:2px;line-height:1.15;cursor:grab}
.piece .pdim{font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
.piece.small-label .pname{display:none}
.piece.no-label > *{display:none}
.piece.sel{outline:3px solid var(--ink);outline-offset:2px;z-index:5}
.piece.dragging{opacity:.88;box-shadow:inset 0 0 0 2px rgba(0,0,0,.22),0 10px 22px rgba(0,0,0,.28);cursor:grabbing;z-index:6}
.panel{flex:none;border-top:1px solid var(--line);background:var(--bg);padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.panel-head{display:flex;align-items:center;gap:10px}
.panel-head .info{flex:1;min-width:0}
.panel-head strong{font-family:var(--font-display);font-size:17px;overflow-wrap:anywhere}
.dot{width:26px;height:26px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.panel-actions{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.panel-actions::-webkit-scrollbar{display:none}

/* Notes */
.notes{padding:10px 16px 28px;display:flex;flex-direction:column;gap:12px;max-width:720px;margin:0 auto}
.note-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note-actions .btn{white-space:normal;text-align:center}
.note-actions label.btn{cursor:pointer}
.note-actions:focus-within label.btn{outline:3px solid var(--accent);outline-offset:2px}
.note{overflow:hidden}
.note img{display:block;width:100%;max-height:420px;object-fit:cover;background:var(--surface-2);cursor:zoom-in}
.note .body{padding:10px 6px 10px 14px;display:flex;gap:6px;align-items:flex-start}
.note .text{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note time{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.missing{padding:30px;text-align:center;color:var(--muted);background:var(--surface-2)}

/* Fenêtres */
#overlays{position:relative;z-index:50}
.scrim{position:fixed;inset:0;background:rgba(18,12,26,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(16px + var(--safe-bottom));max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:22px;padding-bottom:18px}}
.sheet h2{font-family:var(--font-display);margin:0;font-size:21px;font-weight:750}
.sheet p{margin:0}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.field > span{font-size:14px;font-weight:800;color:var(--muted)}
.field input,.field textarea,.field select{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);font-size:16px;width:100%}
.field textarea{min-height:140px;resize:vertical}
.fields{display:flex;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.menu{display:flex;flex-direction:column}
.menu-item{background:none;border:0;text-align:left;padding:13px 6px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:12px;border-radius:10px}
.menu-item:active{background:var(--surface-2)}
.menu-item svg{width:22px;height:22px;color:var(--muted)}
.menu-item.danger,.menu-item.danger svg{color:var(--danger)}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.swatches .chip{width:34px;height:34px}
.pal-row{display:flex;align-items:center;gap:10px;padding:4px 0}
.pal-row input[type=color]{width:46px;height:40px;border:0;padding:0;background:none;border-radius:10px;cursor:pointer}
.pal-row .grow{flex:1;font-weight:700}
.list{display:flex;flex-direction:column}
.list-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.list-row .num{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.total{display:flex;justify-content:space-between;font-weight:800;padding-top:4px;font-variant-numeric:tabular-nums}
.viewer{position:fixed;inset:0;background:#0d0a12;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(12px + var(--safe-top)) 12px calc(12px + var(--safe-bottom))}
.viewer img{max-width:100%;max-height:calc(100% - 60px);object-fit:contain}
.viewer p{color:#eee;margin:10px 0 0;text-align:center;white-space:pre-wrap}
.viewer .icon-btn{position:absolute;top:calc(8px + var(--safe-top));right:8px;color:#fff;background:rgba(255,255,255,.12)}

#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:transparent;border:0;color:var(--accent-soft);font-weight:800;padding:6px 8px;border-radius:8px;text-decoration:underline}
#toast:not(:has(button)){padding-right:16px}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <main id="view"></main>
  <nav id="tabbar" hidden aria-label="Sections du projet"></nav>
</div>
<div id="overlays"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ---------- Outils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const PROPS = new Set(['value', 'checked', 'disabled', 'min', 'max', 'step', 'multiple']);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (PROPS.has(k)) el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
const ico = (svg) => { const s = h('span', { html: svg, 'aria-hidden': 'true', style: { display: 'contents' } }); return s; };
const S_ = (d, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const I = {
  back: S_('<path d="M15 5l-7 7 7 7"/>'),
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="18.5" r="1.9"/></svg>',
  plus: S_('<path d="M12 5v14M5 12h14"/>'),
  minus: S_('<path d="M5 12h14"/>'),
  counter: S_('<path d="M6 5v14M10 5v14M14 5v14M18 5v14M3.5 16.5L20.5 7.5"/>'),
  grid: S_('<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.33h16M4 14.67h16M9.33 4v16M14.67 4v16"/>'),
  shirt: S_('<path d="M8.5 4L3.5 7l2 4 2-1v10h9V10l2 1 2-4-5-3c-.6 1.6-2 2.5-3.5 2.5S9.1 5.6 8.5 4z"/>'),
  notes: S_('<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h3.5"/>'),

function textOn(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;

function plural(n, one, many) { return `${n.toLocaleString('fr-FR')} ${n > 1 ? many : one}`; }
function relTime(t) {
  const d = Date.now() - t, m = 60e3, hr = 60 * m, day = 24 * hr;
  if (d < m) return 'à l’instant';
  if (d < hr) return `il y a ${Math.floor(d / m)} min`;
  if (d < day) return `il y a ${Math.floor(d / hr)} h`;
  if (d < 2 * day) return 'hier';
  if (d < 7 * day) return `il y a ${Math.floor(d / day)} jours`;
  return new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short' }).format(t);
}

/* ---------- Stockage (IndexedDB, avec repli en mémoire) ---------- */
const DB = {
  db: null,
  mem: { projects: new Map(), photos: new Map(), meta: new Map() },
  open() {
    return new Promise((resolve) => {
      let done = false;
      const fin = (v) => { if (!done) { done = true; resolve(v); } };
      try {
        if (!('indexedDB' in window) || !window.indexedDB) return fin(false);
        const req = indexedDB.open('carnet-crochet', 1);
        req.onupgradeneeded = () => {
          const d = req.result;
          if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
        };
        req.onsuccess = () => { this.db = req.result; fin(true); };
        req.onerror = () => fin(false);
        req.onblocked = () => fin(false);
      } catch (e) { fin(false); }
      setTimeout(() => fin(false), 4000);
    });
  },
  _run(store, mode, fn) {
    return new Promise((res, rej) => {
      try {
        const t = this.db.transaction(store, mode);
        const r = fn(t.objectStore(store));
        t.oncomplete = () => res(r ? r.result : undefined);
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error);
      } catch (e) { rej(e); }
    });
  },
  async get(store, key) {
    if (!this.db) return this.mem[store].get(key);
    try { return await this._run(store, 'readonly', (s) => s.get(key)); } catch (e) { return undefined; }
  },
  async all(store) {
    if (!this.db) return [...this.mem[store].values()];
    try { return await this._run(store, 'readonly', (s) => s.getAll()); } catch (e) { return []; }
  },
  async put(store, val, key) {
    if (!this.db) { this.mem[store].set(key !== undefined ? key : val.id, val); return true; }
    try { await this._run(store, 'readwrite', (s) => (key !== undefined ? s.put(val, key) : s.put(val))); return true; }
    catch (e) { storageError(e); return false; }
  },
  async del(store, key) {
    if (!this.db) { this.mem[store].delete(key); return; }
    try { await this._run(store, 'readwrite', (s) => s.delete(key)); } catch (e) { storageError(e); }
  },
};
let storageWarned = false;
function storageError(e) {
  if (storageWarned) return;
  storageWarned = true;
  const full = e && /quota/i.test(e.name + ' ' + e.message);
  toast(full ? 'Plus de place pour enregistrer. Supprime quelques photos.' : 'L’enregistrement a échoué sur cet appareil.');
  setTimeout(() => { storageWarned = false; }, 8000);
}

function normalize(p) {
  p.name = String(p.name || 'Projet sans nom');
  p.createdAt = p.createdAt || Date.now();
  p.updatedAt = p.updatedAt || p.createdAt;
  const c = (p.counters = p.counters || {});
  c.stitches = Math.max(0, c.stitches | 0);
  c.rows = Math.max(0, c.rows | 0);
  if (typeof c.resetOnRow !== 'boolean') c.resetOnRow = true;
  c.target = Math.max(0, c.target | 0);
  const g = (p.grid = p.grid || {});
  g.w = clamp(g.w | 0 || 20, 1, MAXG);
  g.h = clamp(g.h | 0 || 20, 1, MAXG);
  if (!Array.isArray(g.palette) || !g.palette.length) g.palette = DEFAULT_PALETTE.slice();
  if (!Array.isArray(g.cells) || g.cells.length !== g.w * g.h) g.cells = new Array(g.w * g.h).fill(-1);
  if (typeof g.follow !== 'boolean') g.follow = true;
  const pt = (p.pattern = p.pattern || {});
  pt.unit = pt.unit === 'm' ? 'm' : 'cm';
  pt.gauge = pt.gauge || { st: 0, rows: 0 };
  pt.pieces = Array.isArray(pt.pieces) ? pt.pieces : [];
  p.notes = Array.isArray(p.notes) ? p.notes : [];
  return p;
}
function newProject(name) {
  const now = Date.now();
  return normalize({ id: uid(), name, createdAt: now, updatedAt: now });
}
function exampleProject() {
  const p = newProject('Exemple · t-shirt');
  p.counters = { stitches: 7, rows: 4, resetOnRow: true, target: 24 };
  const g = p.grid; g.w = 17; g.h = 15; g.cells = new Array(17 * 15).fill(-1);
  const heart = [
    '..XX.....XX..',
    '.XOXX...XXXX.',
    'XOXXXX.XXXXXX',
    'XXXXXXXXXXXXX',
    'XXXXXXXXXXXXX',
    '.XXXXXXXXXXX.',
    '..XXXXXXXXX..',
    '...XXXXXXX...',
    '....XXXXX....',
    '.....XXX.....',
    '......X......',
  ];
  heart.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch !== '.') g.cells[(y + 2) * g.w + (x + 2)] = ch === 'O' ? 1 : 2;
  }));
  p.pattern.unit = 'cm';
  p.pattern.pieces = [
    { id: uid(), name: 'Manche gauche', w: 4, h: 4, x: 1, y: 1, color: '#a685e2' },
    { id: uid(), name: 'Corps', w: 6, h: 8, x: 5, y: 1, color: '#e8476f' },
    { id: uid(), name: 'Manche droite', w: 4, h: 4, x: 11, y: 1, color: '#a685e2' },
  ];
  p.notes = [{ id: uid(), kind: 'text', text: 'Projet d’exemple pour découvrir l’appli.\nTu peux le supprimer depuis l’accueil (bouton ⋯ à droite du projet).', at: Date.now() }];
  return p;
}

const urlCache = new Map();
async function photoURL(id) {
  if (urlCache.has(id)) return urlCache.get(id);
  const rec = await DB.get('photos', id);
  if (!rec || !rec.blob) return null;
  const u = URL.createObjectURL(rec.blob);
  urlCache.set(id, u);
  return u;
}
function dropPhotoURL(id) { const u = urlCache.get(id); if (u) { URL.revokeObjectURL(u); urlCache.delete(id); } }
function compressImage(file, max = 1600, q = 0.82) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * k), hh = Math.round(img.naturalHeight * k);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
        cv.getContext('2d').drawImage(img, 0, 0, w, hh);
        URL.revokeObjectURL(url);
        cv.toBlob((b) => resolve(b || file), 'image/jpeg', q);
      } catch (e) { URL.revokeObjectURL(url); resolve(file); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
const blobToDataURL = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function dataURLToBlob(u) { const r = await fetch(u); return r.blob(); }

function modal({ title, body = [], actions = [], onClose, focus = true }) {

    if (closed) return; closed = true;
    scrim.remove(); document.removeEventListener('keydown', onKey);
    if (onClose) onClose();

  const onKey = (e) => { if (e.key === 'Escape') close(); };
  const sheet = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title || 'Fenêtre' },
    title && h('h2', null, title), ...body,
    actions.length ? h('div', { class: 'actions' }, actions.map((a) => h('button', {
      type: 'button', class: 'btn ' + (a.kind || ''),
      onClick: async () => { const r = a.onClick ? await a.onClick() : undefined; if (r !== false) close(); },
    }, a.label))) : null);
  const scrim = h('div', { class: 'scrim', onClick: (e) => { if (e.target === scrim) close(); } }, sheet);
  $('#overlays').append(scrim);
  document.addEventListener('keydown', onKey);
  if (focus) setTimeout(() => { const f = sheet.querySelector('input:not([type=color]):not([type=checkbox]),textarea'); if (f) { f.focus(); if (f.select && f.type === 'text') f.select(); } }, 60);
  return { close, sheet };
}

    let out = null;
    const input = h('input', { type: 'text', value, maxlength: '80', id: 'prompt-input', enterkeyhint: 'done' });
    const m = modal({ title, body: [h('label', { class: 'field', for: 'prompt-input' }, h('span', null, label), input)],

/* ---------- Enregistrement de fichiers (sauvegarde, image de la grille) ---------- */
let dlPromise = null;
function getDownloads() {
  const hasClaude = window.claude && typeof window.claude.use === 'function';
  if (!hasClaude) return Promise.resolve('anchor');
  if (!dlPromise) {
    dlPromise = Promise.race([
      Promise.resolve().then(() => window.claude.use('downloads')).catch(() => null),
      new Promise((r) => setTimeout(() => r(null), 10000)),
    ]);
  }
  return dlPromise;
}
async function saveFile(name, blob) {
  const dl = await getDownloads();
  if (dl === 'anchor') {
    const a = h('a', { href: URL.createObjectURL(blob), download: name, style: { display: 'none' } });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    return true;
  }
  if (!dl) { toast('Le téléchargement n’est pas possible dans cette vue.'); return false; }
  try { await dl.save({ filename: name, data: blob }); toast('Fichier enregistré'); return true; }
  catch (e) { toast(e && e.code === 'declined' ? 'Enregistrement annulé' : 'Le fichier n’a pas pu être enregistré'); return false; }
}

let wake = null;

    if (on) {

        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });

  } catch (e) { wake = null; }
}

function projectMeta(p) {
  const photos = p.notes.filter((n) => n.kind === 'photo').length;
  const parts = [];
  if (p.counters.rows || p.counters.stitches) parts.push(`Rang ${p.counters.rows + 1}`);
  if (photos) parts.push(plural(photos, 'photo', 'photos'));
  parts.push(relTime(p.updatedAt));
  return parts.join(' · ');
}
function thumbFor(p) {
  const box = h('div', { class: 'thumb', 'aria-hidden': 'true' });
  const photos = p.notes.filter((n) => n.kind === 'photo').sort((a, b) => b.at - a.at);
  const g = p.grid;
  const hasGrid = g.cells.some((v) => v >= 0);
  const fallback = () => {
    if (hasGrid) {
      const cv = h('canvas');
      drawGrid(cv, g, Math.max(1, Math.floor(68 / Math.max(g.w, g.h))), { labels: false, lines: false });
      box.replaceChildren(cv);
    } else box.textContent = (p.name.trim()[0] || '?').toUpperCase();
  };
  if (photos.length) {
    photoURL(photos[0].photoId).then((u) => { if (u) box.replaceChildren(h('img', { src: u, alt: '' })); else fallback(); });
  } else fallback();
  return box;

  viewResize = () => { if (!S.grid.zoom) draw(); };
}

/* ---------- Patron ---------- */

      ]));
      const body = h('div', { class: 'body' },
        h('div', { class: 'text' }, n.text || null, h('time', { datetime: new Date(n.at).toISOString() }, fmtDate(n.at))), menu);
      if (n.kind === 'photo') {
        const img = h('img', { alt: n.text || 'Photo du projet', loading: 'lazy', onClick: () => viewer(n, img.src) });
        photoURL(n.photoId).then((u) => { if (u) img.src = u; else img.replaceWith(h('div', { class: 'missing' }, 'Photo introuvable sur cet appareil')); });
        return h('article', { class: 'card note' }, img, body);
      }
      return h('article', { class: 'card note' }, body);
    }));
  }
  async function addPhotos(files) {
    const list = [...(files || [])].filter((f) => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|gif)$/i.test(f.name));
    fileInput.value = '';
    if (!list.length) return;
    toast(list.length > 1 ? `Ajout de ${list.length} photos…` : 'Ajout de la photo…');
    let added = 0;
    for (const f of list) {
      const blob = await compressImage(f);
      if (!blob) continue;
      const id = uid();
      if (await DB.put('photos', { id, projectId: p.id, blob })) {
        p.notes.push({ id: uid(), kind: 'photo', photoId: id, text: '', at: Date.now() + added });
        added++;
      }
    }
    if (added) { touch(p); fill(); toast(added > 1 ? `${added} photos ajoutées` : 'Photo ajoutée'); }
    else toast('Cette image n’a pas pu être lue.');
  }
  function noteModal(n) {
    const isPhoto = n && n.kind === 'photo';
    const ta = h('textarea', { id: 'note-text', maxlength: '4000', placeholder: isPhoto ? 'ex. Fin du rang 12' : 'ex. Crochet 4 mm, laine coton « Rose poudré »…' });
    ta.value = n ? n.text : '';
    modal({ title: isPhoto ? 'Légende' : n ? 'Modifier la note' : 'Nouvelle note', body: [h('label', { class: 'field', for: 'note-text' }, h('span', null, isPhoto ? 'Légende de la photo' : 'Note'), ta)],
      actions: [{ label: 'Annuler' }, { label: 'Enregistrer', kind: 'primary', onClick: () => {
        const t = ta.value.trim();
        if (n) { n.text = t; }
        else { if (!t) { ta.focus(); return false; } p.notes.push({ id: uid(), kind: 'text', text: t, at: Date.now() }); }
        touch(p); fill();
      } }] });
  }
  async function removeNote(n) {
    const ok = await confirmBox(n.kind === 'photo' ? 'Supprimer cette photo ?' : 'Supprimer cette note ?', 'Elle sera supprimée de cet appareil.');
    if (!ok) return;
    p.notes = p.notes.filter((x) => x !== n);
    if (n.kind === 'photo') { dropPhotoURL(n.photoId); await DB.del('photos', n.photoId); }
    touch(p); fill();
  }
  function viewer(n, src) {
    if (!src) return;
    const close = () => { v.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    const v = h('div', { class: 'viewer', role: 'dialog', 'aria-label': 'Photo', onClick: close },
      h('img', { src, alt: n.text || 'Photo du projet' }), n.text ? h('p', null, n.text) : null, iconBtn(I.close, 'Fermer', close));
    $('#overlays').append(v);
    document.addEventListener('keydown', onKey);
  }
  fill();
}

/* ---------- Redimensionnement ---------- */
let viewResize = null, lastW = window.innerWidth, resizeT = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (window.innerWidth === lastW) return; // le clavier mobile change seulement la hauteur
    lastW = window.innerWidth;
    if (S.currentId && (S.tab === 'grille' || S.tab === 'patron') && viewResize) viewResize();
  }, 150);
});

/* ---------- Démarrage ---------- */
async function init() {
  S.storageOk = await DB.open();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  let list = await DB.all('projects');
  const seeded = await DB.get('meta', 'seeded');
  if (!list.length && !seeded) {
    const ex = exampleProject();
    list = [ex];
    await DB.put('projects', ex);
    await DB.put('meta', true, 'seeded');
  }
  S.projects = list.map(normalize);
  S.byId = new Map(S.projects.map((p) => [p.id, p]));
  route();
  setTimeout(() => {
    getDownloads().then((d) => {
      const can = !!d;
      if (can !== S.canDownload) { S.canDownload = can; if (!can && !S.currentId) render(); }
    });
  }, 300);
}
init();
</script>
